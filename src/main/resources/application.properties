spring.datasource.url=jdbc:mysql://127.0.0.1:3306/todo_db?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=admin

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Настройка логирования
# Указываем путь и имя файла, куда будут сохраняться логи
logging.file.name=logs/todolist.log

# Указываем уровень детализации для нашего кода (INFO - стандартные события)
logging.level.com.example.todolist=INFO

# Настройка формата (необязательно, но так красивее)
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n